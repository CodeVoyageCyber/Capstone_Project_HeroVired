apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      labels:
        component: web
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              component: web
      containers:
        - name: client
          image: prashantdey/merndemoapp:clientv1.6
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 150m
              memory: 512Mi
          ports:
            - containerPort: 3000
