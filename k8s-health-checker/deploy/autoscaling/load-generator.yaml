# Load Generator Deployment — Sprint 4
#
# Generates synthetic concurrent HTTP request traffic against:
#   - client-cluster-ip-service:3000
#   - api-gateway-cluster-ip-service:5000/api/summary (or root)
#
# Drives CPU utilization on the target pods to trigger HPA scale-out.
# Deleting this deployment stops traffic, allowing HPA to scale back in.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: default
  labels:
    app: load-generator
    component: load-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: traffic-generator
          image: busybox:1.36
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting continuous load generation against GratitudeApp..."
              while true; do
                # Generate concurrent HTTP traffic
                wget -q -O- http://client-cluster-ip-service:3000 > /dev/null 2>&1 || true
                wget -q -O- http://api-gateway-cluster-ip-service:5000 > /dev/null 2>&1 || true
              done
