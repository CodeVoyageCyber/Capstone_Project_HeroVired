# RBAC for the health-checker app. Runs in the "default" namespace
# (same as GratitudeApp) so it can watch/manage GratitudeApp's pods
# and deployments directly. The ClusterRole grants read access cluster
# -wide (for node checks) plus write access to pods/deployments for
# self-healing actions added in Sprint 3.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: health-checker
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: health-checker-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "events"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: health-checker-binding
subjects:
  - kind: ServiceAccount
    name: health-checker
    namespace: default
roleRef:
  kind: ClusterRole
  name: health-checker-role
  apiGroup: rbac.authorization.k8s.io
