apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-checker
  namespace: health-checker
  labels:
    app: health-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-checker
  template:
    metadata:
      labels:
        app: health-checker
    spec:
      serviceAccountName: health-checker
      containers:
        - name: health-checker
          image: <YOUR_ECR_REPO_URI>:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: health-checker
  namespace: health-checker
spec:
  selector:
    app: health-checker
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
