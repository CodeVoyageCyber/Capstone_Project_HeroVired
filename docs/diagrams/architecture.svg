<text x="666" y="812" class="">Prometheus data source</text>
<text x="666" y="834" class="">Sprint 2: node / pod health</text>
<text x="666" y="856" class="">Sprint 6: full observability</text>
<rect x="1040" y="760" width="310" height="130" rx="10" fill="#fff" stroke="#ccd6e3"/>
