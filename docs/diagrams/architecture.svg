<text x="56" y="1032" class="">files-service → S3 (requires IAM / IRSA)</text>
<text x="56" y="1054" class="">AWS FIS → EKS pods (configured experiments)</text>
<rect x="500" y="980" width="440" height="95" rx="10" fill="#fff7e8" stroke="#ccd6e3"/>
<text x="516" y="1007" class="head">Optional EKS node autoscaling</text>
<text x="516" y="1032" class="">Cluster Autoscaler → EC2 Auto Scaling Group</text>
<text x="516" y="1054" class="">Requires IAM, ASG discovery tags, matching version</text>
<rect x="970" y="980" width="430" height="95" rx="10" fill="#f0f4fa" stroke="#ccd6e3"/>
