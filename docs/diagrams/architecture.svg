<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc"><title id="title">GratitudeApp: Minikube implementation to Amazon EKS</title><desc id="desc">All six sprints implemented locally then redeployed to EKS. Shared Kubernetes application, health-checker, monitoring and optional AWS integrations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#52657b"/></marker></defs><rect width="1440" height="1110" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#20334b;font-size:15px}.title{font-size:28px;font-weight:bold}.head{font-size:18px;font-weight:bold}.small{font-size:13px}.line{fill:none;stroke:#52657b;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:6 5}</style>
<text x="40" y="44" class="title">GratitudeApp | Kubernetes health monitoring and auto-healing</text>
<text x="40" y="72" class="">Deployment journey: all six sprints implemented on Minikube, then transferred to Amazon EKS</text>
<rect x="40" y="100" width="600" height="125" rx="10" fill="#eaf6f1" stroke="#ccd6e3"/>
<text x="56" y="127" class="head">1  Local implementation · Minikube</text>
<text x="56" y="152" class="">nginx addon + local access / tunnel · locally built health-checker</text>
<text x="56" y="174" class="">HostPath storage (local StorageClass named gp3)</text>
<text x="56" y="196" class="">Local failure tests · same application and observability stack</text>
<rect x="790" y="100" width="610" height="125" rx="10" fill="#eaf1ff" stroke="#ccd6e3"/>
<text x="806" y="127" class="head">2  Cloud deployment · Amazon EKS</text>
<text x="806" y="152" class="">eksctl · managed EC2 node group · OIDC · single NAT gateway</text>
<text x="806" y="174" class="">AWS NLB + ingress-nginx · EBS CSI / gp3 volumes</text>
<text x="806" y="196" class="">ECR health-checker image · Docker Hub application images</text>
<path d="M640 162 H790" class="line"/>
<text x="675" y="148" class="small">Redeploy</text>
<rect x="40" y="250" width="1360" height="700" rx="10" fill="#fff" stroke="#8098b8"/>
<text x="56" y="277" class="head">Shared Kubernetes stack · local cluster or EKS cluster</text>
<rect x="60" y="300" width="180" height="112" rx="10" fill="#f0f4fa" stroke="#ccd6e3"/>
<text x="76" y="327" class="head">Users / operators</text>
<text x="76" y="352" class="">App via ingress</text>
<text x="76" y="374" class="">APIs / Grafana via</text>
<text x="76" y="396" class="">kubectl port-forward</text>
<rect x="280" y="300" width="290" height="112" rx="10" fill="#eaf1ff" stroke="#ccd6e3"/>
<text x="296" y="327" class="head">Ingress · nginx</text>
<text x="296" y="352" class="">Minikube: addon / tunnel</text>
<text x="296" y="374" class="">EKS: AWS NLB → nginx</text>
<text x="296" y="396" class="">Path routing to app services</text>
<rect x="610" y="300" width="490" height="112" rx="10" fill="#eaf1ff" stroke="#ccd6e3"/>
<text x="626" y="327" class="head">default namespace · GratitudeApp</text>
<text x="626" y="352" class="">client · api-gateway · server-main · files-service</text>
<text x="626" y="374" class="">entries-service · moods-api / moods-service</text>
<text x="626" y="396" class="">stats-api / stats-service · REST + gRPC</text>
<rect x="1140" y="300" width="240" height="112" rx="10" fill="#eaf1ff" stroke="#ccd6e3"/>
