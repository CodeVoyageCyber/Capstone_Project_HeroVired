<text x="756" y="527" class="">Read nodes, pods and deployments</text>
<text x="756" y="549" class="">Delete qualifying unhealthy pods</text>
<text x="756" y="571" class="">ReplicaSet / Deployment recreates pods</text>
<text x="756" y="593" class="">HPA targets client, gateway and server</text>
