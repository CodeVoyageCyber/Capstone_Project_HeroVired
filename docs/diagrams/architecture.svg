<text x="296" y="502" class="head">Health-checker · default namespace</text>
<text x="296" y="527" class="">FastAPI :8000 · /metrics · REST API</text>
<text x="296" y="549" class="">Monitor · healer · balance reports</text>
<text x="296" y="571" class="">Healing audit + notification history</text>
<text x="296" y="593" class="">ServiceAccount + ClusterRole / Binding</text>
<rect x="740" y="475" width="360" height="155" rx="10" fill="#eaf6f1" stroke="#ccd6e3"/>
