<text x="105" y="973" class="body">Monitoring chart also installs Prometheus Operator and Alertmanager; no custom alert routing is configured in Sprint 1.</text>
<text x="65" y="1024" class="body">Local PVCs survive pod recreation; deleting the KinD cluster removes its local data.</text>
<text x="45" y="1085" class="small">Access: localhost port-forwards. Frontend assets and backend API are tested separately; shared browser /api routing is outside this baseline.</text>
